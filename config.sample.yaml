paths:
  - path: /var/www/myapp
    exclude:
      - cache
      - tmp
      - vendor
      - node_modules
  - path: /var/www/myapp/.env
  - path: /etc/nginx/nginx.conf
  - path: /etc/nginx/sites-available
db:
  host: localhost
  port: 3306
  name: myapp
  user: myapp
  password: "CHANGE_ME"
backup:
  temp_dir: /tmp/backup
  local_dir: /var/backups/myapp
  max_archives: 14
logging:
  dir: /opt/backup/logs
  max_log_files: 30
alerts:
  enabled: true
  smtp_host: smtp.example.com
  smtp_port: 587
  use_tls: true
  username: noreply@example.com
  password: "CHANGE_ME"
  from_email: noreply@example.com
  to_emails:
    - admin@example.com
sharepoint:
  enabled: true
  tenant_id: "YOUR_TENANT_ID"
  client_id: "YOUR_APP_CLIENT_ID"
  client_secret: "CHANGE_ME"
  site_id: "YOUR_SITE_ID"
  drive_id: "YOUR_DRIVE_ID"
  folder_path: "/backups"
google_drive:
  enabled: false
  credentials_file: /opt/backup/service_account.json
  folder_id: "YOUR_GOOGLE_DRIVE_FOLDER_ID"
