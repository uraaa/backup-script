# Shown in logs and in failure alerts (email/Telegram subject), so you can
# tell which project/server a notification is about. Defaults to the config
# file's name if omitted.
name: myapp

# Optional native Frappe backup mode. When enabled, `paths` and `db` below
# are ignored and the utility runs Bench as the current operating-system user.
frappe:
  enabled: false
  bench_dir: /home/frappe/frappe-bench
  site: erp.testpro.io

paths:
  # For a directory, a .gitignore found at its root is applied automatically
  # (node_modules, .next, .env, etc. get excluded without listing them by hand).
  # Set `gitignore: false` to disable that and rely only on `exclude`.
  - path: /var/www/myapp
    exclude:              # optional, on top of .gitignore
      - cache
      - tmp
  - path: /var/www/myapp/.env
  - path: /etc/nginx/nginx.conf
  - path: /etc/nginx/sites-available
db:
  type: mysql               # mysql (or mariadb) | postgres (or postgresql)
  host: localhost
  port: 3306                # 5432 for postgres
  name: myapp
  user: myapp
  password: "CHANGE_ME"
  # docker_container: myapp_db_1  # optional: run pg_dump via `docker exec` in this
                                   # container instead of connecting over host/port
                                   # (use when Postgres only runs inside a docker
                                   # network, e.g. docker-compose without an exposed port)
backup:
  temp_dir: /tmp/backup
  local_dir: /var/backups/myapp
  max_archives: 14
logging:
  dir: /opt/backup/logs
  max_log_files: 30
# Failure notifications. Each sub-section is an independent channel — enable
# as many as you like, add a new one (e.g. slack) the same way. TestPro
# production installations must keep both email and Telegram enabled. Store
# real credentials only in the deployed config.yaml, never in this repository.
alerts:
  email:
    enabled: true
    smtp_host: email-smtp.us-west-2.amazonaws.com
    smtp_port: 587
    use_tls: true
    username: "CHANGE_ME"       # Amazon SES SMTP username
    password: "CHANGE_ME"
    from_email: info@testpro.io
    to_emails:
      - yuriy@testpro.io
  telegram:
    enabled: true
    bot_token: "CHANGE_ME"     # from @BotFather
    chat_id: "473762021"
sharepoint:
  enabled: true
  tenant_id: "YOUR_TENANT_ID"
  client_id: "YOUR_APP_CLIENT_ID"
  client_secret: "CHANGE_ME"
  site_id: "YOUR_SITE_ID"
  drive_id: "YOUR_DRIVE_ID"
  folder_path: "/backups"
google_drive:
  enabled: false
  credentials_file: /opt/backup/service_account.json
  folder_id: "YOUR_GOOGLE_DRIVE_FOLDER_ID"
aws_s3:
  enabled: false
  access_key_id: "YOUR_AWS_ACCESS_KEY_ID"
  secret_access_key: "CHANGE_ME"
  region: "us-east-1"
  bucket: "YOUR_BUCKET_NAME"
  prefix: "backups"
  # endpoint_url: "https://s3.example.com"  # only for S3-compatible providers, omit for real AWS
mailru:
  enabled: false
  username: "you@mail.ru"
  password: "CHANGE_ME"          # app password: Облако -> Настройки -> Пароли для внешних приложений
  remote_folder: "/backups"
  # webdav_url: "https://webdav.cloud.mail.ru"
